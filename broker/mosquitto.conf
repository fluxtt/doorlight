# Mosquitto config for door light project
# Two listeners:
#   1883 - standard MQTT, used by the ESP32 and (later) Home Assistant
#   9001 - MQTT over websockets, used by the browser control page
 
listener 1883
allow_anonymous true
 
listener 9001
protocol websockets
allow_anonymous true
 
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
 
